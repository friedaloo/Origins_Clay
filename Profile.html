<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>

        <style>
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        }
        body
        {
            font-family:Arial, sans-serif;
            background:#efeddd;
        }
        .main
        {
            width:100%;
            min-height:100vh;
            padding:20px 40px;
        }

        .title
        {
            font-size:18px;
            margin-bottom:20px;
            color:black;
        }
        .profile-part
        {
            display:flex;
            flex-direction:column;
            align-items:center;
            margin-bottom:40px;
        }
        .profile
        {
            width:220px;
            height:220px;
            border-radius:50%;
            border: 1px solid #c8c3bd;
            overflow:hidden;
        }

        .profile img
        {
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .change-profile
        {
            margin-top:18px;
        }

        .change-profile a
        {
            text-decoration:none;
            color:#00a2ff;
            font-size:18px;
        }

        .fill
        {
            width:100%;
            max-width:1100px;
            margin:auto;
        }

        .blank-part
        {
            display:flex;
            align-items:center;
            margin-bottom:22px;
            gap:20px;
            width:100%;
        }

        .info-box
        {
            flex: 1;
            width: auto;
            background:white;
            padding:18px 25px;
            font-size:20px;
            color:#222;
        }

        .edit-button
        {
            min-width:50px;
        }

        .edit-button a
        {
            text-decoration:none;
            color:blue;
            font-size:13px;
        }
        @media(max-width:768px)
        {

            .main
            {
                padding:20px;
            }

            .profile
            {
                width:170px;
                height:170px;
            }

            .change-profile a
            {
                font-size:16px;
            }

            .blank-part
            {
                flex-direction:column;
                align-items:flex-start;
                width: 100%;
                gap:8px;
            }
            .info-box
            {
                width:100%;
                font-size:16px;
                padding:15px;
            }

            .edit-button
            {
                margin-left:5px;
            }

        }

        @media(max-width:480px)
        {

            .title{
                font-size:16px;
            }

            .profile
            {
                width:140px;
                height:140px;
            }

            .info-box
            {
                font-size:14px;
            }

            .change-profile a
            {
                font-size:14px;
            }

        }

        </style>
    </head>
<body>

<div class="main">

    <div class="title">
        Personal Info
    </div>
    <div class="profile-part">

        <div class="profile">
            <img src="/Origins_Clay-images/Origins_Clay-images/Profile.png" alt="profile">
        </div>

        <div class="change-profile">
            <a href="#">Change Profile</a>
        </div>

    </div>

    <!-- INFO -->
    <div class="fill">

        <div class="blank-part">
            <input class="info-box" placeholder="Username"></input>
            <div class="edit-button">
                <a href="#">Edit</a>
            </div>
        </div>

        <div class="blank-part">
            <input class="info-box" placeholder="Email"></input>
            <div class="edit-button">
                <a href="#">Edit</a>
            </div>
        </div>

        <div class="blank-part">
            <input class="info-box" placeholder="password"></input>
            <div class="edit-button">
                <a href="#">Edit</a>
            </div>
        </div>

        <div class="blank-part">
            <input class="info-box" placeholder="First Name"></input>
            <div class="edit-button">
                <a href="#">Edit</a>
            </div>
        </div>

        <div class="blank-part">
            <input class="info-box" placeholder="Last Name"></input>
            <div class="edit-button">
                <a href="#">Edit</a>
            </div>
        </div>
        <div class="blank-part">
            <input class="info-box" type="tel" placeholder="Phone Number"></input>
            <div class="edit-button">
                <a href="#">Edit</a>
            </div>
        </div>

    </div>

</div>

</body>
</html>
