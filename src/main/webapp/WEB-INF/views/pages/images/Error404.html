<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            font-family:Arial, sans-serif;
            background:#efeedf;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .outer-div
        {
            padding-top: 100px;
            text-align:center;
        }

        .outer-div h1
        {
            font-size:80px;
            color:#1f1f1f;
            font-weight:400;
            margin-bottom:40px;
        }

        .buttons
        {
            gap:20px;
        }
        .btn1
        {
            margin: auto;
            width:220px;
            height:55px;
            display:flex;
            background:#556b3f;
            color:white;
            justify-content:center;
            align-items:center;
            text-decoration:none;
            font-size:12px;
            letter-spacing:2px;
            transition:0.3s ease;
        }

        .btn1:hover
        {
            background:#3a452e;
        }

        @media (max-width:768px)
        {

            .outer-div h1
            {
                font-size:55px;
                margin-bottom:30px;
            }

            .buttons
            {
                flex-direction:column;
                align-items:center;
            }

            .btn1
            {
                width:100%;
                max-width:300px;
            }
        }

        @media (max-width:480px)
        {

            .outer-div h1
            {
                font-size:42px;
            }

            .btn1
            {
                height:50px;
                font-size:11px;
            }
        }

    </style>
</head>
<body>
    <div class="outer-div">
        <h1>404 Error</h1>
        <div class="buttons">
            <a href="#" class="btn1">Return Back</a>
        </div>
    </div>
</body>
</html>
